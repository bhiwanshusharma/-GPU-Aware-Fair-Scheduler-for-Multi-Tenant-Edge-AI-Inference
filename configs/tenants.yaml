# Multi-Tenant Configuration Catalog
# Defines tenant identities, relative scheduling weights, priority tiers, quotas, and SLAs.

tenants:
  - tenant_id: "tenant_robotics"
    name: "Autonomous Robotics Safety Subsystem"
    weight: 4.0
    priority: 10
    gpu_quota_pct: 40.0
    quota_window_ms: 1000.0
    sla_latency_target_ms: 15.0
    max_queue_capacity: 50
    workload_type: "AUDIO_ANOMALY"

  - tenant_id: "tenant_surveillance"
    name: "Interactive Edge Vision Surveillance"
    weight: 2.0
    priority: 5
    gpu_quota_pct: 35.0
    quota_window_ms: 1000.0
    sla_latency_target_ms: 50.0
    max_queue_capacity: 100
    workload_type: "VISION_DETECTION"

  - tenant_id: "tenant_analytics"
    name: "Background Video Indexing & Analytics"
    weight: 1.0
    priority: 1
    gpu_quota_pct: 25.0
    quota_window_ms: 1000.0
    sla_latency_target_ms: 250.0
    max_queue_capacity: 200
    workload_type: "VISION_CLASSIFICATION"
